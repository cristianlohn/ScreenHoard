[package]
name = "screen-hoard"
version = "0.3.0"
description = "Utilitário nativo de histórico de área de transferência e screenshots para Windows"
authors = ["ScreenHoard Team"]
edition = "2021"

[lib]
name = "screen_hoard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
directories = "5.0"
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.4"
winreg = "0.55"
gif = "0.13"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Media",
    "Win32_UI_Input_KeyboardAndMouse"
] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
]

[profile.dev.package."*"]
opt-level = 3
